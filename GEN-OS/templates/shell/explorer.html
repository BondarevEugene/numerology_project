<div class="gen-explorer">
    <div class="gen-panel-header">
        <div>
            <div class="gen-panel-title">
                GENESIS Explorer
            </div>
            <div class="gen-panel-subtitle">
                Workspace Navigator
            </div>
        </div>
    </div>

    <!-- =================================================== -->
    <!-- WORKSPACES -->
    <!-- =================================================== -->

    <div class="gen-section">
        <div class="gen-section-title">
            WORKSPACES
        </div>
        <div class="gen-workspace-list">
            <div class="gen-tree-item active"
                 data-workspace="human">
                🧠 Human Intelligence
            </div>
            <div class="gen-tree-item"
                 data-workspace="knowledge">
                📚 Knowledge
            </div>
            <div class="gen-tree-item"
                 data-workspace="graph">
                🌐 Graph
            </div>
            <div class="gen-tree-item"
                 data-workspace="import">
                📥 Import
            </div>
            <div class="gen-tree-item"
                 data-workspace="simulation">
                🧪 Simulation
            </div>
            <div class="gen-tree-item"
                 data-workspace="ai">
                🤖 AI
            </div>
            <div class="gen-tree-item"
                 data-workspace="career">
                💼 Career
            </div>
            <div class="gen-tree-item"
                 data-workspace="platform">
                ⚙ Platform
            </div>
        </div>
    </div>

    <!-- =================================================== -->
    <!-- KNOWLEDGE TREE -->
    <!-- =================================================== -->

    <div class="gen-section">
        <div class="gen-section-title">
            KNOWLEDGE GRAPH
        </div>
        <div class="gen-tree">
            {% for group in tree %}
            <div class="gen-tree-group">
                <div class="gen-tree-group-header">
                    <span>{{ group.icon }}</span>
                    <span>{{ group.title }}</span>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
